name: unit

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The library without dwarfs, on every platform: no dependencies to build, so this is the fastest signal.
  # Covers the path, host IO, overlay, lock, creation and revision logic. Archive mounting is compiled out.
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DRWZFS_WITH_DWARFS=OFF -DRWZFS_USE_CCACHE=OFF -DCMAKE_BUILD_TYPE=Release -DRWZFS_BUILD_TESTS=ON -DRWZFS_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel
