name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Library without dwarfs: builds and tests on every platform. Covers the path, host IO,
  # overlay, lock, creation and revision logic. Archive mounting is compiled out.
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DRWZFS_WITH_DWARFS=OFF -DRWZFS_USE_CCACHE=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel

  # Full library with dwarfs built from source (Linux and macOS). Windows is not included yet:
  # the dwarfs Windows build has not been verified.
  full:
    name: full (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4

      # Only build tools come from the package manager. Every library (dwarfs and its dependencies) is
      # built from pinned sources into build-deps/, once, by the configure step below on a cache miss.
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build pkg-config cmake

      - name: Select Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then
            echo "No Xcode installed. Installed:"; ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcode-select -p
          clang++ --version

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config cmake

      # vcpkg supplies dwarfs's dependencies (vcpkg.json). The installed tree, the binary cache and build-deps/
      # (dwarfs, built from script against vcpkg) are cached. The triplets make the libraries static.
      - name: Set up vcpkg
        shell: bash
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Restore vcpkg and dwarfs cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vcpkg_installed
            ~/.cache/vcpkg/archives
            build-deps
          key: rwz-vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-triplets/*', 'vcpkg-ports/**', 'scripts/deps/**') }}-p2
          restore-keys: |
            rwz-vcpkg-${{ matrix.os }}-


      # The defaults: vcpkg dependencies (VCPKG_ROOT is set above, so the toolchain is found). The first
      # configure installs the packages and builds dwarfs.
      - name: Configure rwzfs
        env:
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/vcpkg-triplets
          VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/vcpkg-ports
          VCPKG_DEFAULT_TRIPLET: ${{ runner.os == 'macOS' && 'arm64-osx-static' || 'x64-linux-static' }}
        run: cmake -S . -B build -DRWZFS_USE_CCACHE=OFF -DCMAKE_BUILD_TYPE=Release -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel -E rwzfs_example

      - name: Showcase (host tree, mounted archive, writes, revision)
        run: ctest --test-dir build -C Release --output-on-failure -R rwzfs_example

      - name: Backtrace of the creator test's throws (Linux, on failure)
        if: failure() && runner.os == 'Linux'
        # Stops at each C++ throw in the creator test and prints the top frames, then the
        # frames that mention "optional" (the bad_optional_access source) are shown in full.
        run: |
          sudo apt-get install -y gdb
          cmd=(gdb -batch -ex 'set pagination off' -ex 'catch throw' -ex run)
          for i in $(seq 40); do cmd+=(-ex 'bt 15' -ex continue); done
          cmd+=(--args build/rwzfs_tests --gtest_filter='CreateView.*')
          "${cmd[@]}" > gdb.log 2>&1 || true
          grep -n -i "optional" gdb.log | head -n 40 || true
          echo "---- first 15 throws (top frames) ----"
          grep -n "^#" gdb.log | head -n 300 || true

      # Saved even when the build fails: the packages compiled so far are kept for the next run.
      - name: Save vcpkg and dwarfs cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            vcpkg_installed
            ~/.cache/vcpkg/archives
            build-deps
          key: rwz-vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-triplets/*', 'vcpkg-ports/**', 'scripts/deps/**') }}-p2-${{ github.run_id }}

  # Static dependencies and dwarfs built with MSVC (Git Bash runs the scripts). rwzfs itself is not
  # built here yet: its archive creator and merged view still use POSIX directory calls.
  deps-windows:
    name: static deps and dwarfs (windows)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install build tools
        shell: pwsh
        run: |
          choco install -y ninja pkgconfiglite strawberryperl
          # OpenSSL's Configure needs a complete perl. Put Strawberry Perl first on PATH.
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg and dwarfs cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vcpkg_installed
            ~/AppData/Local/vcpkg/archives
            build-deps
          key: rwz-vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-triplets/*', 'vcpkg-ports/**', 'scripts/deps/**') }}-p2
          restore-keys: |
            rwz-vcpkg-windows-


      # Static CRT and static libraries (x64-windows-static), matching rwzfs's MultiThreaded runtime.
      - name: Configure rwzfs (windows)
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-static-rel
        run: |
          # CMake wants forward slashes; the workspace path from the shell has backslashes on Windows.
          ws=$(cygpath -m "$PWD")
          cmake -S . -B build -DRWZFS_WITH_DWARFS=ON \
            -DVCPKG_INSTALLED_DIR="$ws/vcpkg_installed" \
            -DVCPKG_OVERLAY_TRIPLETS="$ws/vcpkg-triplets" \
            -DVCPKG_OVERLAY_PORTS="$ws/vcpkg-ports"

      - name: Build rwzfs (windows)
        run: cmake --build build --config Release --parallel

      - name: Test (windows)
        run: ctest --test-dir build -C Release --output-on-failure --parallel -E rwzfs_example

      - name: Showcase (windows)
        run: ctest --test-dir build -C Release --output-on-failure -R rwzfs_example

      # Saved even when the build fails: the packages compiled so far are kept for the next run.
      - name: Save vcpkg and dwarfs cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            vcpkg_installed
            ~/AppData/Local/vcpkg/archives
            build-deps
          key: rwz-vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-triplets/*', 'vcpkg-ports/**', 'scripts/deps/**') }}-p2-${{ github.run_id }}

  # AddressSanitizer + UndefinedBehaviorSanitizer over the tests (no dwarfs: fast). Any report fails
  # its test (-fno-sanitize-recover); LeakSanitizer runs at exit.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build cmake

      - name: Configure (sanitizer)
        run: cmake -S . -B build-sanitize -DRWZFS_SANITIZE=ON -DRWZFS_WITH_DWARFS=OFF -DCMAKE_CXX_COMPILER=g++-14

      - name: Build (sanitizer)
        run: cmake --build build-sanitize --parallel

      - name: Test (sanitizer)
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure --parallel

  # The scripts path: dwarfs and its dependencies built from pinned sources (scripts/deps), no vcpkg. The
  # first run takes hours; build-deps/ is cached, keyed on the scripts, so later runs reuse it.
  scripts-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build pkg-config cmake

      - name: Cache build-deps (scripts)
        uses: actions/cache@v4
        with:
          path: build-deps
          key: rwz-scripts-deps-${{ hashFiles('scripts/deps/**') }}-p1

      - name: Configure rwzfs (RWZFS_DEPS=scripts)
        run: cmake -S . -B build -DRWZFS_DEPS=scripts -DRWZFS_USE_CCACHE=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel
