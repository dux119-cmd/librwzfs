name: sanitize

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sanitize-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # AddressSanitizer + UndefinedBehaviorSanitizer over the tests (no dwarfs: fast). Any report fails its test
  # (-fno-sanitize-recover); LeakSanitizer runs at exit.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build cmake

      - name: Configure (sanitizer)
        run: cmake -S . -B build-sanitize -DRWZFS_SANITIZE=ON -DRWZFS_WITH_DWARFS=OFF -DCMAKE_CXX_COMPILER=g++-14 -DRWZFS_BUILD_TESTS=ON -DRWZFS_BUILD_EXAMPLES=ON

      - name: Build (sanitizer)
        run: cmake --build build-sanitize --parallel

      - name: Test (sanitizer)
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-sanitize --output-on-failure --parallel
