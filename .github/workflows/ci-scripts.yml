name: scripts

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: scripts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Dependencies built from pinned sources (scripts/deps), no vcpkg: RWZFS_DEPS=scripts. The first build of a
  # platform takes hours; build-deps/ is cached per platform, keyed on the scripts, and saved even when the
  # build fails. CMake's build-all.sh also runs bash, found on Windows through Git.
  scripts:
    name: scripts (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-15
          - name: windows
            os: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build pkg-config cmake

      - name: Select Xcode and install tools (macOS)
        if: matrix.name == 'macos'
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then
            echo "No Xcode installed. Installed:"; ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcode-select -p
          clang++ --version
          brew install ninja pkg-config cmake

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.name == 'windows'

      - name: Install build tools (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install -y ninja pkgconfiglite strawberryperl
          # The scripts need a complete perl (OpenSSL's Configure): Strawberry Perl first on PATH.
          echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache build-deps (scripts)
        uses: actions/cache/restore@v4
        with:
          path: build-deps
          key: rwz-scripts-${{ matrix.name }}-${{ hashFiles('scripts/deps/**') }}-p1
          restore-keys: |
            rwz-scripts-${{ matrix.name }}-

      - name: Configure rwzfs (RWZFS_DEPS=scripts)
        shell: bash
        run: cmake -S . -B build -DRWZFS_DEPS=scripts -DRWZFS_USE_CCACHE=OFF -DCMAKE_BUILD_TYPE=Release -DRWZFS_BUILD_TESTS=ON -DRWZFS_BUILD_EXAMPLES=ON

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure --parallel

      - name: Save build-deps cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build-deps
          key: rwz-scripts-${{ matrix.name }}-${{ hashFiles('scripts/deps/**') }}-p1-${{ github.run_id }}
